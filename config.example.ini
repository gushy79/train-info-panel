# Train Info Panel: configuration
#
# 1. Copy this file to  config.ini  (same folder) and edit the copy.  config.ini is never committed to git.
# 2. Run   python3 tools/provision.py   to write the settings to the panel over USB.
#    Changing a setting later = edit config.ini and run that command again. No rebuild, no code changes.
#
# Lines starting with # or ; are comments. Keep comments on their own lines: a # inside a value
# is part of the value. Leave a setting out (or commented) to get its default.
# The values below are the defaults: an example set up for Berkhamsted (BKM), a stopping-train station in the UK.

# ---------------------------------------------------------------------------------------------------
# REQUIRED: your Wi-Fi. The panel only does 2.4 GHz Wi-Fi (not 5 GHz-only networks).
[wifi]
ssid = YOUR_WIFI_NAME
password = YOUR_WIFI_PASSWORD

# ---------------------------------------------------------------------------------------------------
# REQUIRED: your free Rail Data Marketplace key (see README: "Get a data key").
[api]
key = YOUR_RAIL_DATA_MARKETPLACE_KEY

# ---------------------------------------------------------------------------------------------------
# The station to show: its 3-letter National Rail (CRS) code, and the name to display in the header.
[station]
crs = BKM
name = Berkhamsted

# ---------------------------------------------------------------------------------------------------
# Directions you can swipe between, in order. The first one is shown after a restart.
# Up to 5 (direction.1 ... direction.5), numbered without gaps.
#
#   label  - text in the header (max 16 characters)
#   toward - the 3-letter code of a station the trains must call at. The panel shows trains that
#            stop there. For a direction of travel, use the NEXT station along the line in that
#            direction: every train that way calls there, whatever its final destination.
#            Leave it empty for all trains.
#
# Here: Berkhamsted has Hemel Hempstead (HML) as the next station towards London (south) and
# Tring (TRI) as the next station the other way (north).
[direction.1]
label = Southbound
toward = HML

[direction.2]
label = Northbound
toward = TRI

[direction.3]
label = All trains
toward =

# ---------------------------------------------------------------------------------------------------
# How often the panel asks for updates. The free data tier is believed to allow about 100,000 requests
# a month; provision.py prints an estimate for your settings and warns if you would exceed it.
[polling]
# The direction on screen. Minimum 30.
visible_interval_seconds = 60
# The other directions, kept warm so a swipe is instant. Minimum 60.
background_interval_seconds = 240
# Give up on a request after this long (3 to 30).
request_timeout_seconds = 10
# Trains requested per update (4 to 10). The screen shows at most 6.
rows = 8

# ---------------------------------------------------------------------------------------------------
# Warnings and alerts.
[warnings]
# No successful update for this long: the screen turns amber and says STALE (2 to 60).
stale_after_minutes = 10
# Start showing how old the data is ("LIVE 3m") once it is this old (30 to 3600).
show_age_after_seconds = 120
# A full-screen alert appears when the next train is cancelled, changes platform, or is late by at least
# alert_delay_minutes (1 to 120).
alert_delay_minutes = 10
# How long the alert stays up, in seconds (0 to 60; 0 turns that kind of alert off). Two settings, because
# there are two situations:
#   after_touch: you swiped or tapped a moment ago, so you are looking at the panel. The alert only has to
#                register, and it is in the way of the times you came for, so keep it short.
#   on_update:   a background refresh found the problem and you may be across the room. It has to stay up
#                long enough to be noticed. It shows once per change, so a longer time does not nag.
alert_seconds_after_touch = 5
alert_seconds_on_update = 15

# ---------------------------------------------------------------------------------------------------
# Overnight, nobody is catching a train: no updates and the screen goes off.
# A touch wakes it, refreshes the data, and keeps it on for wake_seconds after the last touch.
[quiet_hours]
enabled = yes
# Local time, 0 to 23. The screen is off from start_hour until end_hour (it may wrap past midnight).
start_hour = 21
end_hour = 6
# How long a touch keeps the screen on in quiet hours (10 to 3600).
wake_seconds = 120
# Your time zone as a POSIX string (this default is UK time, GMT/BST).
timezone = GMT0BST,M3.5.0/1,M10.5.0

# ---------------------------------------------------------------------------------------------------
# Swipe feel.
[touch]
# How far a swipe must travel, out of the screen's 320 pixels width (20 to 250).
swipe_distance_pixels = 70
# ... and how fast it must be done (200 to 3000 milliseconds).
swipe_time_ms = 900
